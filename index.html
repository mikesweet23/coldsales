<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outbound</title>
  <meta name="description" content="Work the client. Every day. A sales outreach app for your phone.">
  <meta name="theme-color" content="#0B0B0C">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Outbound">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    try { var t = localStorage.getItem('outbound.theme'); document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); } catch (e) {}
  </script>
</head>
<body>
  <header id="appbar"></header>
  <main id="view" aria-live="polite"><p class="boot muted">Loading…</p></main>
  <nav id="tabbar" aria-label="Main"></nav>
  <div id="sheets"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:16px">Outbound needs JavaScript to run.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
